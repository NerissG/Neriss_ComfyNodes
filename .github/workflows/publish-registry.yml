name: Publish tagged registry release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/check-release.yml

  publish:
    # Only an explicitly selected release tag can publish; never PR code.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    environment: comfy-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check registry identity and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if not metadata["tool"]["comfy"].get("PublisherId"):
              raise SystemExit("Choose your Registry publisher and set tool.comfy.PublisherId before publishing.")
          if os.environ["RELEASE_TAG"] != "v" + metadata["project"]["version"]:
              raise SystemExit("Release tag must match project.version.")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.9.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run lint && pnpm run typecheck && pnpm run test && pnpm audit && pnpm run check:release
        working-directory: web
      - run: python -m pip install comfy-cli==1.22.0
      - name: Publish verified tagged source and committed assets
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          test -n "$REGISTRY_ACCESS_TOKEN"
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
